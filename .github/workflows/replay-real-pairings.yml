name: Replay Real Pairing Emails

on:
  workflow_dispatch:
    inputs:
      sender:
        description: Exact Tabroom sender address
        required: true
        default: midamericacup_1790512207@www.tabroom.com
      subject:
        description: Subject substring
        required: true
        default: Round 5 CX

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Replay matching real emails into the test channel
        run: node scripts/replay-real-pairings.js
        env:
          E2E_GMAIL_EMAIL: ${{ secrets.E2E_GMAIL_EMAIL }}
          E2E_GMAIL_APP_PASSWORD: ${{ secrets.E2E_GMAIL_APP_PASSWORD }}
          E2E_DISCORD_TOKEN: ${{ secrets.E2E_DISCORD_TOKEN }}
          E2E_DISCORD_CHANNEL_ID: '1492506305842249728'
          E2E_TABROOM_EMAIL: ${{ secrets.E2E_TABROOM_EMAIL }}
          E2E_TABROOM_PASSWORD: ${{ secrets.E2E_TABROOM_PASSWORD }}
          E2E_NOTION_TOKEN: ${{ secrets.E2E_NOTION_TOKEN }}
          E2E_JUDGE_DATABASE_ID: ${{ secrets.E2E_JUDGE_DATABASE_ID }}
          REPLAY_FROM: ${{ inputs.sender }}
          REPLAY_SUBJECT: ${{ inputs.subject }}
